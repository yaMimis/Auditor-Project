name: Pipeline de Validação (CI)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes-automatizados:
    name: Validação de Código e Banco de Dados
    runs-on: ubuntu-latest

    # db temporário para os testes
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auditor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # O mesmo SQL que o Docker roda na 1ª criação do banco, em ordem.
      # Quebrou um CREATE, uma view ou uma regra da tabela de decisões → CI vermelha.
      - name: Aplicar o esquema do banco (db/0*.sql)
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/0*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d auditor_db -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Conferir as regras da tabela de decisões (teste SQL do Marcos)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d auditor_db -v ON_ERROR_STOP=1 -f db/testes/05_teste_decisoes.sql

      # Validações
      - name: Rodar Bateria de Testes do Pytest
        env:
          # Aponta os testes para o banco temporário criado no passo 2
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auditor_db
        run: |
          pytest tests/ -v

  build-da-imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Buildx
        uses: docker/setup-buildx-action@v3

      # Garante que o Dockerfile continua construindo. Cache do GitHub: só o 1º build é lento.
      - name: Construir a imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: auditor-preco-justo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
