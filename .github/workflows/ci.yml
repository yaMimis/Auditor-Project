#CRITERIO DE GOVERNANÇA DE CODIGO
#p/ segurança e integração continua
name: CI Basico - Auditor

on:
  push:
    branches: [ "main", "dados/*", "setup-fastapi-prever" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Chekout do repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Validar ambiente
        run: |
          python --version
          echo "CI configurado"
