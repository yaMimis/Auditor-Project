#docker compose build (para rodar as imagens)
#docker compose up -d (para rodar o container e colocar o app no ar)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: auditor_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auditor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    restart: unless-stopped

  api:
    build: .
    container_name: auditor_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/auditor_db
    depends_on:
      - postgres
    restart: unless-stopped

  streamlit:
    build: .
    container_name: auditor_streamlit
    command: streamlit run src/app/main.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data: