# Auditor de Preço Justo: banco (PostgreSQL + pgvector), API (8000) e painel (8501).
#   docker compose up -d            sobe tudo (usa a imagem já construída)
#   docker compose up -d --build    reconstrói a imagem antes (mudou código ou requirements)
#   docker compose down             para tudo (os dados do banco ficam no volume)
# No Windows, o atalho é o .\iniciar.ps1.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: auditor_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auditor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d   # só na 1ª criação do volume (subpastas são ignoradas)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auditor_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: auditor-preco-justo:latest   # a mesma imagem serve o painel: um build só
    container_name: auditor_api
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env              # GOOGLE_API_KEY (e MODELO_LLM, se quiser trocar) para o parecer
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/auditor_db   # vence a do .env (localhost)
    volumes:
      - ./modelos_salvos:/app/modelos_salvos   # pacote_prever_v1.joblib (fora do Git)
      - cache_modelos_hf:/root/.cache/huggingface   # modelo de busca nas normas: baixa uma vez só
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A 1ª subida baixa o modelo de busca nas normas (~0,5 GB): por isso o start_period longo.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 180s
    restart: unless-stopped

  streamlit:
    image: auditor-preco-justo:latest   # construída pelo serviço api
    pull_policy: never
    container_name: auditor_streamlit
    command: streamlit run src/app/main.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./docs/resultados:/app/docs/resultados   # carteira_auditoria.csv e equidade.json do lote
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  cache_modelos_hf:
